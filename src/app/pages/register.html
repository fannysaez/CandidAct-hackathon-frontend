<div class="container py-5" style="max-width: 460px">
  <h1 class="h3 mb-4">Créer un compte</h1>

  <form (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label" for="firstname">Prénom</label>
      <input id="firstname" name="firstname" class="form-control" [(ngModel)]="user.firstname" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="lastname">Nom</label>
      <input id="lastname" name="lastname" class="form-control" [(ngModel)]="user.lastname" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input id="email" name="email" type="email" class="form-control" [(ngModel)]="user.email" required />
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Mot de passe</label>
      <input id="password" name="password" type="password" class="form-control" [(ngModel)]="user.password" required minlength="8" />
    </div>

    @for (error of errors; track error) {
      <div class="alert alert-danger py-2">{{ error }}</div>
    }

    <button type="submit" class="btn btn-primary w-100">Créer mon compte</button>
  </form>

  <p class="mt-3 text-center">
    Déjà un compte ? <a routerLink="/login">Se connecter</a>
  </p>
</div>
