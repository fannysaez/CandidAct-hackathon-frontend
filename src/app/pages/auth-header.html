<header class="d-flex justify-content-between align-items-center bg-white px-4 py-2">
  <div class="d-flex align-items-center gap-2 small fw-semibold">
    <img src="logo.png" alt="Candid'Act" height="28" />
    <span>Candid'Act</span>
  </div>
  <a
    class="btn btn-sm fw-bold"
    style="border: 1.5px solid var(--color-french-blue); color: var(--color-french-blue)"
    [routerLink]="link"
  >{{ label }}</a>
</header>
