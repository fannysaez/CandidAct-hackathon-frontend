<div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
  <p class="small fw-bold text-uppercase mb-3" style="color: var(--color-french-blue)">Informations</p>

  <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
    <span class="text-black-50 small">Date de candidature</span>
    <span class="fw-bold small">{{ application().applyDate | date:'dd/MM/yyyy' }}</span>
  </div>

  <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
    <span class="text-black-50 small">Méthode</span>
    <span class="fw-bold small">{{ application().applicationMethod || 'Non spécifiée' }}</span>
  </div>

  <div class="d-flex justify-content-between align-items-center pt-2">
    <span class="text-black-50 small">Expire le</span>
    @if (application().offer?.expirationDate) {
    <span class="fw-bold small">{{ application().offer?.expirationDate | date:'dd/MM/yyyy' }}</span>
    } @else {
    <span class="fw-bold small">Non définie</span>
    }
  </div>
</div>
