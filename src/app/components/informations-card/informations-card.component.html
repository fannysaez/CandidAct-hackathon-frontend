<div class="container my-4">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h3 class="h6 fw-bold mb-4" style="color: var(--color-french-blue); letter-spacing: 0.5px;">INFORMATIONS</h3>

        <div class="d-flex justify-content-between align-items-center py-2 border-bottom"
            style="border-color: var(--color-alabaster-grey) !important;">
            <span class="text-muted" style="font-size: 0.9rem;">Date de candidature</span>
            <span class="fw-bold" style="color: var(--color-black)">{{ application().applyDate | date:'dd/MM/yyyy'
                }}</span>
        </div>

        <div class="d-flex justify-content-between align-items-center py-2 border-bottom"
            style="border-color: var(--color-alabaster-grey) !important;">
            <span class="text-muted" style="font-size: 0.9rem;">Méthode</span>
            <span class="fw-bold" style="color: var(--color-black);">{{ application().applicationMethod || 'Non
                spécifiée'
                }}</span>
        </div>

        <div class="d-flex justify-content-between align-items-center pt-2">
            <span class="text-muted" style="font-size: 0.9rem;">Expire le</span>
            <span class="fw-bold" style="color: var(--color-black);">{{ application().offer?.expirationDate ?
                (application().offer?.expirationDate | date:'dd/MM/yyyy') : 'Non définie' }}</span>
        </div>
    </div>
</div>
