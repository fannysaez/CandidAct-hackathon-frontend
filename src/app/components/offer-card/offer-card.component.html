<div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
  <p class="small fw-bold text-uppercase mb-3" style="color: var(--color-french-blue)">Description de l’offre</p>
  <div class="bg-light rounded-3 p-3 mb-3" style="border: 1.5px dashed var(--color-alabaster-grey)">
    <p class="mb-0 small">{{ application().offer?.description }}</p>
  </div>
  @if (application().offer?.url) {
  <div class="text-center">
    <a [href]="application().offer?.url" class="fw-bold small text-decoration-none"
      style="color: var(--color-french-blue)">
      Voir l’offre originale
    </a>
  </div>
  }
</div>
