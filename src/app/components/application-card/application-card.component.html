<div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
  <h2 class="fs-3 mb-1">{{ application().offer?.jobTitle ?? application().label }}</h2>
  <p class="fs-5 fw-bold text-black-50 mb-3">{{ application().company.name }}</p>
  <div class="d-flex flex-wrap align-items-center gap-2">
    @if (application().offer?.contractType) {
    <span class="badge rounded-pill px-3 py-2"
      style="background: var(--color-alabaster-grey); color: var(--color-black)">
      {{ application().offer?.contractType }}
    </span>
    }
    <span class="badge rounded-pill px-3 py-2"
      style="background: var(--color-french-blue); color: var(--color-white)">
      {{ application().company.city }}
    </span>
    @if (application().status) {
    <span class="badge rounded-pill px-3 py-2"
      style="background: var(--color-sea-green); color: var(--color-white)">
      {{ application().status }}
    </span>
    }
  </div>
</div>
