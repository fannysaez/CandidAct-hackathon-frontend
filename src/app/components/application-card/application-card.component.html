<div class="container my-4">
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h2 class="h4 fw-bold mb-1" style="color: var(--color-black);">{{application().offer?.jobTitle ??
                    application().label}}</h2>
                <p class="text-muted mb-3" style="font-size: 0.95rem;">{{application().company.name}} . <span
                        class="d-md-none">{{application().company.city}}</span></p>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 mt-2">
            @if (application().offer?.contractType) {
            <span class="badge rounded-pill px-3 py-2"
                style="background-color: var(--color-alabaster-grey); color: var(--color-black); font-weight: 600;">
                {{application().offer?.contractType}}
            </span>
            }
            <span class="d-none d-md-block badge rounded-pill px-3 py-2"
                style="background-color: var(--color-french-blue); color: var(--color-white); font-weight: 600;">
                {{application().company.city}}
            </span>
            @if (application().status) {
            <span class="badge rounded-pill px-3 py-2 text-white"
                style="background-color: var(--color-sea-green); font-weight: 600;">
                {{application().status}}
            </span>
            }
        </div>
    </div>
</div>
