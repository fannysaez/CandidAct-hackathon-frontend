name: CD

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Préparer le dossier candidact
        run: cp -r dist/*/browser candida

      - name: Publier l'artefact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: front-${{ github.ref_name }}
          path: candida
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger l'artefact
        uses: actions/download-artifact@v4
        with:
          name: front-${{ github.ref_name }}
          path: candida

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Connexion en SSH
        run: ssh -o StrictHostKeyChecking=accept-new ${{ secrets.USER_SERVER }}@${{ secrets.IP_SERVER }} 'exit'

      - name: Envoi du projet
        run: scp -r candida/* ${{ secrets.USER_SERVER }}@${{ secrets.IP_SERVER }}:candidact/